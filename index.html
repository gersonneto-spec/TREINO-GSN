<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foco</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foco">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: coluna de celular. Bloco azul cheio abre a tela, títulos em itálico condensado de uniforme esportivo,
     capa em preto e laranja no topo, interface clara em azul, listas planas no lugar de caixas repetidas. Registro sobe em folha, a partir do polegar. Tema único, claro. */
  --bg:#F1F5FC;
  --surface:#FFFFFF;
  --ink:#071A44;
  --muted:#55668E;
  --line:#D6E0F1;
  --blue:#0A4BE0;
  --blue-deep:#062F9E;
  --sky:#DCE8FF;
  --ice:#EBF2FF;
  --good:#0E7C55;
  --orange:#FF5A00;
  --gold:#B33F00;
  --gold-soft:#FFE9DC;
  --m0:#CFDBEF;--m1:#A9C4F7;--m2:#6E9AF0;--m3:#346CE6;--m4:#0A3FC4;
  --shadow:0 1px 0 rgba(7,26,68,.04),0 6px 18px rgba(7,26,68,.07);
  --font-display:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 92px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:34px;letter-spacing:.02em;line-height:1;text-transform:uppercase;color:var(--orange)}
.brand.hello{font-family:var(--font-body);font-style:normal;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--blue)}
.top-right{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--good)}
.sync[data-s="saving"]::before{background:var(--blue)}
.sync[data-s="pend"]::before{background:var(--gold)}
.btn-ghost{font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--sky);color:var(--blue-deep)}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.h{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:23px;line-height:1;letter-spacing:.01em;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.h::before{content:"";width:6px;height:18px;background:var(--orange);transform:skewX(-14deg);flex:none}
.sub{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Abertura */
.cover{border-radius:18px;overflow:hidden;background:#0B0B0C;box-shadow:var(--shadow)}
.cover img{display:block;width:100%;height:124px;object-fit:cover;object-position:50% 92%;background:#0B0B0C}
.cover figcaption{padding:11px 16px 14px}
.cover .who{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:5px}
.cover p{margin:0;color:#fff;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-deep) 100%);color:#fff;border-radius:18px;padding:18px 18px 12px}
.hero::after{content:"";position:absolute;top:-20%;right:-12%;width:62%;height:140%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 14px,transparent 14px 36px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:60px;line-height:.8;padding-top:6px}
.big small{font-size:28px;font-weight:700;margin-left:8px;opacity:.85}
.hero-meta{text-align:right;font-size:12.5px;line-height:1.3;opacity:.92}
.hero-meta b{display:block;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.hero svg{display:block;width:100%;height:auto;margin-top:12px}
.hm{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:baseline;width:100%;text-align:left;color:#fff;margin-top:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25);font-size:14px}
.hm b{font-weight:700}
.hm .prog{grid-column:1/-1;background:rgba(255,255,255,.25);margin:0}
.hm .prog i{background:#fff}
.strip.rep{background:var(--blue);margin-bottom:10px}
.plan b{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:23px;line-height:1}
.plan span.d{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.plans{gap:8px;padding-bottom:10px}
.pcard.new{border-left-color:var(--line);justify-content:center;width:132px;color:var(--blue)}
.pcard.new b{font-size:19px}
.tm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;margin:0 0 14px}
.tm .k,.sessbar .k{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.tm b{display:block;font-family:var(--font-display);font-weight:800;font-size:36px;line-height:1}
.tm .why{display:block;font-size:12px;opacity:.85}
.tm .btn-ghost{flex:none;background:#fff;color:var(--ink);padding:13px 12px;font-size:14px}
.tm.run{background:var(--orange);color:#1A0A00}
.tm.rest{background:var(--blue)}
.tm.rest.over{background:var(--gold)}
.sessbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px}
.sessbar b{display:block;font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1}
.sessbar .btn-ghost{background:#fff;color:var(--ink)}
.sv small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.srow.dn .sn{color:var(--good)}
.srow.run{border-color:var(--orange)}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr) 42px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow:first-of-type{border-top:0}
.ebtns{display:flex;flex-direction:column;gap:4px}
.ebtns button{width:36px;height:27px;border-radius:7px;background:var(--ice);color:var(--blue-deep);font-weight:700}
.ebtns button:disabled{opacity:.3}
.el{text-align:left;min-width:0}
.el b{display:block;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.el span{font-size:12.5px;color:var(--muted)}
.erow .sdel,.xrow .sdel{width:42px;height:42px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font-size:14px;font-weight:700}
.xrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) 42px;gap:8px;align-items:center;margin-bottom:6px;font-size:14px;color:var(--muted)}
.xrow input{height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);text-align:center;font-weight:700;width:100%;font-size:16px;color:var(--ink)}
.xrow .stype{font-size:12px;font-weight:700;padding:10px 9px;border-radius:8px;background:var(--blue);color:#fff;min-width:66px}
.xrow .stype.w{background:var(--sky);color:var(--blue-deep)}
.headbtns{display:flex;gap:6px;flex:none}
.row .s.alt{font-size:12px;color:var(--blue-deep)}
.swbtn{font-size:13px;font-weight:700;color:var(--blue);padding:2px 0 12px;text-align:left;width:100%}
.pcard{flex:none;width:176px;text-align:left;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border-left:5px solid var(--orange);padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.pcard b{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:21px;line-height:1}
.pcard span{font-size:12px;color:var(--muted)}
.pcard .pp{color:var(--blue-deep);font-weight:600}
.pcard.done{border-left-color:var(--good)}
.rx{background:var(--ice);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:0 0 12px}
.rx .k{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:1px}
.cta:disabled{opacity:.45}
.alvo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ice);border-left:4px solid var(--orange);border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 14px}
.alvo .k{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep)}
.alvo b{display:block;font-family:var(--font-display);font-weight:800;font-size:27px;line-height:1.05}
.alvo .why{display:block;font-size:12.5px;color:var(--muted)}
.alvo .btn-ghost{flex:none;background:var(--blue);color:#fff}
.srow{display:grid;grid-template-columns:24px auto minmax(0,1fr) auto 42px;align-items:center;gap:7px;padding:6px 6px 6px 8px;border-radius:10px;border:2px solid transparent;background:var(--bg);margin-bottom:6px;cursor:pointer}
.srow.on{border-color:var(--blue);background:var(--surface)}
.srow .sn{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--blue);text-align:center}
.srow.wu .sn{color:var(--muted)}
.srow .stype{font-size:12px;font-weight:700;padding:7px 8px;border-radius:8px;background:var(--blue);color:#fff;min-width:60px}
.srow.wu .stype{background:var(--sky);color:var(--blue-deep)}
.srow .sv{font-weight:700;font-size:16px}
.srow.wu .sv{color:var(--muted);font-weight:600}
.srow .sfeel{font-size:12px;font-weight:600;padding:7px 6px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);min-width:62px}
.srow .sfeel.set{background:var(--ice);color:var(--blue-deep);box-shadow:none}
.srow .sdel{width:42px;height:42px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font-size:15px;font-weight:700;position:relative;z-index:1}
.srow.on .sdel{background:var(--ice)}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.addrow .pill{text-align:center}
.savebar{position:sticky;bottom:0;background:var(--surface);padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 14px);margin-bottom:calc(-1*(env(safe-area-inset-bottom,0px) + 18px))}
#win{position:fixed;inset:0;z-index:70;background:#0B0B0C;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(env(safe-area-inset-bottom,0px) + 20px);cursor:pointer}
#win[hidden]{display:none}
#win img{display:block;width:100%;max-width:480px;max-height:58%;object-fit:cover}
#win .w1{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:58px;line-height:.9;text-transform:uppercase;color:var(--orange);margin:18px 16px 8px}
#win .w2{font-size:17px;font-weight:600;margin:0 22px}
#win .w3{font-size:13px;opacity:.65;margin:16px 0 0}
.bb-bar{fill:rgba(255,255,255,.35)}
.bb-collar{fill:#fff}
.bb-plate.on{fill:#fff}
.bb-plate.off{fill:rgba(255,255,255,.2)}
.bb-plate.future{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.5;stroke-dasharray:4 4}
.bb-plate.today{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:2.5}
.bb-letter{font:600 11px var(--font-body);fill:rgba(255,255,255,.75)}
.bb-letter.now{fill:#fff;font-weight:700}
.mission{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--orange);width:100%;text-align:left}
.mission b{font-size:16px;line-height:1.2}
.mission .n{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:28px;color:var(--orange);line-height:1}
.mission .prog{grid-column:1/-1}

.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar .d{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;text-align:center;flex:1;line-height:1}
.daybar .d span{display:block;font-family:var(--font-body);font-style:normal;font-size:12px;font-weight:500;color:var(--muted);text-transform:none;margin-top:3px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:22px;line-height:1;display:grid;place-items:center;color:var(--blue)}
.iconbtn:disabled{opacity:.35}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grp{background:var(--surface);border-radius:12px;padding:11px 6px 10px 10px;text-align:left;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:var(--shadow);border-bottom:4px solid var(--sky)}
.grp:active{background:var(--ice)}
.grp b{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:16.5px;line-height:1;overflow-wrap:anywhere}
.grp span{font-size:11.5px;color:var(--muted);font-weight:500}
.grp.done{background:var(--blue);border-bottom-color:var(--blue-deep);color:#fff}
.grp.done span{color:#fff;font-weight:600}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .l{min-width:0;flex:1}
.row .t{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.row .r{text-align:right;flex:none;font-size:13px;color:var(--muted)}
.row .r b{display:block;font-size:15px;color:var(--ink);font-weight:700}
.row .rk{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:30px;line-height:1;color:var(--blue);width:22px;flex:none;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--ice);color:var(--blue-deep)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:transparent;box-shadow:inset 0 0 0 1px var(--good);color:var(--good)}
.empty{font-size:14px;color:var(--muted);padding:6px 0;margin:0}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px}
.strip b{display:block;font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:22px;line-height:1}
.strip span{font-size:13px;opacity:.8}
.strip .go{font-weight:700;opacity:1;flex:none;font-size:20px}
.note{font-size:13px;color:var(--blue-deep);background:var(--sky);border-radius:12px;padding:10px 12px}

/* Abas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--blue);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--blue);border-radius:0 0 3px 3px}

/* Folha */
#backdrop{position:fixed;inset:0;background:rgba(7,26,68,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:31;overscroll-behavior:contain}
#sheet.on{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh-title{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:32px;line-height:.96;text-transform:uppercase;margin:0 0 6px;overflow-wrap:anywhere}
.sh-sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.sh-sub b{color:var(--ink)}
.field{margin-bottom:14px}
.field>label,.field>.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:stretch}
.stepper button{height:58px;border-radius:12px;background:var(--sky);color:var(--blue-deep);font-size:28px;font-weight:700;line-height:1}
.stepper button:active{background:var(--m1)}
.stepper input{width:100%;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:center;font-family:var(--font-display);font-weight:800;font-size:40px;padding:0 6px}
.stepper input:focus{border-color:var(--blue);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .stepper{grid-template-columns:44px minmax(0,1fr) 44px;gap:6px}
.two .stepper button{height:52px;font-size:24px}
.two .stepper input{height:52px;font-size:32px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:8px 13px;border-radius:10px;background:var(--ice);color:var(--blue-deep);font-size:13.5px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--blue);color:#fff}
.pill.sm{padding:5px 10px;font-size:12.5px}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pill{flex:none}
.txt{width:100%;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 14px}
.txt:focus{border-color:var(--blue);outline:0}
.cta{width:100%;height:58px;border-radius:12px;background:var(--blue);color:#fff;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.cta:active{background:var(--blue-deep)}
.linkbtn{font-size:14px;font-weight:600;color:var(--muted);padding:12px;width:100%}
.lab-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.lab-row .lab{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Gráficos */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font-body);font-variant-numeric:tabular-nums}
.ax{font-size:10.5px;fill:var(--muted)}
.val{font-size:11px;fill:var(--muted);font-weight:600}
.val.now{fill:var(--ink);font-weight:700}
.gridl{stroke:var(--line);stroke-width:1}
.base{stroke:var(--muted);stroke-width:1;opacity:.5}
.metal{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.6}
.bar{fill:var(--blue)}
.bar.low{fill:var(--m1)}
.ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:rgba(10,75,224,.1)}
.pt{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.pt.end{fill:var(--ink)}
.endl{font-size:12.5px;font-weight:700;fill:var(--ink)}
.legend{font-size:12px;color:var(--muted);margin:8px 0 0}
.gb{display:grid;grid-template-columns:116px 1fr 30px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.gb .track{position:relative;height:12px;background:var(--ice);border-radius:4px}
.gb .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px}
.gb .avg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.gb .v{text-align:right;font-weight:700}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.trio div{background:var(--ice);border-radius:10px;padding:9px 10px}
.trio span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.trio b{font-size:16px}
.sel{width:100%;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 10px;margin-bottom:10px}
#tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;pointer-events:none;max-width:240px}

/* Desafios */
.ch{padding:12px 0;border-top:1px solid var(--line)}
.ch:first-of-type{border-top:0;padding-top:4px}
.ch-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch-top b{font-size:15px;line-height:1.2}
.ch-top span{font-size:13px;font-weight:700;flex:none}
.ch.done .ch-top span{color:var(--good)}
.prog{height:8px;border-radius:4px;background:var(--ice);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:4px}
.ch.done .prog i{background:var(--good)}
.ch p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:1.5px dashed var(--line);border-radius:12px;padding:11px 12px}
.badge b{display:block;font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:19px;line-height:1}
.badge span{font-size:12px;color:var(--muted)}
.badge.on{border:1.5px solid var(--blue);background:var(--blue);color:#fff}
.badge.on span{color:#fff;font-weight:600}

/* Corpo */
.bodywrap{display:grid;grid-template-columns:1fr;justify-items:center;gap:6px}
svg.body{width:100%;max-width:236px;height:auto;display:block}
.bd{fill:#E4EBF8}
.mus{stroke:#fff;stroke-width:1.5;cursor:pointer}
.mus.s0{fill:var(--m0)}.mus.s1{fill:var(--m1)}.mus.s2{fill:var(--m2)}.mus.s3{fill:var(--m3)}.mus.s4{fill:var(--m4)}
.mus.sel{stroke:var(--ink);stroke-width:2.6}
.abl{fill:none;stroke:#fff;stroke-width:1.5;pointer-events:none}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);justify-content:center;flex-wrap:wrap}
.scale i{width:14px;height:10px;border-radius:3px;display:inline-block}
.tipbox{background:var(--ice);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;margin-top:12px}
.tipbox .k,.tk{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:2px}

/* Técnicas */
details.tec{border-top:1px solid var(--line)}
details.tec:first-of-type{border-top:0}
details.tec summary{list-style:none;padding:14px 0;cursor:pointer}
details.tec summary::-webkit-details-marker{display:none}
.tec-n{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tec-n b{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:24px;line-height:1}
.tec-n span{font-size:12px;color:var(--muted);flex:none}
details.tec summary p{margin:4px 0 0;font-size:14px;color:var(--muted)}
details.tec[open] summary .tec-n b{color:var(--blue)}
details.tec .body{padding:0 0 16px;font-size:14.5px}
details.tec .body p{margin:0 0 12px}
details.tec ol{margin:0 0 12px;padding-left:20px}
details.tec ol li{margin-bottom:4px;padding-left:2px}
details.tec ol li::marker{font-weight:700;color:var(--blue)}
.tk{color:var(--muted)}
.week-tec{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;border-radius:16px;padding:16px 18px}
.week-tec .eyebrow{color:rgba(255,255,255,.8)}
.week-tec h3{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:40px;line-height:.95;text-transform:uppercase;margin:4px 0 8px}
.week-tec p{margin:0;font-size:14.5px}
.qi{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:4px 8px}
.qi:first-of-type{border-top:0}
.qi .rk{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:30px;line-height:1;color:var(--blue)}
.qi-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qi-h b{font-size:15.5px;line-height:1.2}
.qi-h span{font-size:13px;font-weight:700;flex:none}
.qi p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.rules{margin:0;padding-left:20px;font-size:14.5px}
.rules li{margin-bottom:7px}
.rules li::marker{font-weight:700;color:var(--blue)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols div{background:var(--ice);border-radius:10px;padding:11px 12px;font-size:13.5px}
.cols b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:4px}
.cols ul{margin:0;padding-left:16px}
.cols li{margin-bottom:3px}

#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);max-width:448px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .22s}
#toast.on{transform:none;opacity:1}
#toast.gold{background:var(--orange);color:#1A0A00;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function planDesc(P){if(P.d)return P.d;var seen={},out=[];P.ex.forEach(function(x){var n=(GNAME[x.g]||'').toLowerCase();if(n&&!seen[n]){seen[n]=1;out.push(n);}});return out.slice(0,3).join(', ')||'sem exercícios';}

  return x.s.map(function(r,i){var lo=r[1],hi=r[2]!=null?r[2]:(out[i]&&out[i][0]===lo?out[i][1]:lo);return [r[0]?1:0,lo,hi];});

function derive(days){

  dates.forEach(function(dt){
    var es=(days[dt].entries||[]).slice().sort(function(a,b){return (a.t||0)-(b.t||0);});
    es.forEach(function(e){var o=Object.assign({},e);o.date=dt;list.push(o);});
  });

  list.forEach(function(e){

function weekCount(Dx,ws){var n=0;for(var i=0;i<7;i++)if(Dx.trained[addDays(ws,i)])n++;return n;}
function streaks(Dx,meta){
  var ds=Object.keys(Dx.trained).sort();if(!ds.length)return {cur:0,best:0};
  var cw=weekStart(today()),run=0,best=0;
  for(var w=weekStart(ds[0]);w<=cw;w=addDays(w,7)){
    var ok=weekCount(Dx,w)>=meta;
    if(ok){run++;if(run>best)best=run;}else if(w!==cw){run=0;}
  }
  return {cur:run,best:best};
}

/* ---------- Sincronização ---------- */
var db=null,ver={},flushing={},retryT=null,readOnly=false;
function setSync(){
  var el=$('#sync'),s,t;
  if(!db){s='local';t='Neste aparelho';}
  else if(Object.keys(flushing).some(function(k){return flushing[k];})){s='saving';t='Salvando';}
  else if(Object.keys(S.dirty).length){s='pend';t='Envio pendente';}
  else{s='ok';t='Sincronizado';}
  el.dataset.s=s;el.textContent=t;
}
function docData(path){
  if(path==='config/app')return clone(S.cfg);
  var d=S.days[path.slice(5)];
  return d&&d.entries&&d.entries.length?clone(d):null;
}
function commit(path){
  S.dirty[path]=1;ver[path]=(ver[path]||0)+1;
  if(path.indexOf('dias/')===0){var k=path.slice(5);if(S.days[k]&&!(S.days[k].entries||[]).length)delete S.days[k];}
  saveLocal();D=derive(S.days);render();flush(path);
}
function flush(path){
  if(!db||readOnly||flushing[path])return;
  flushing[path]=true;setSync();
  (function loop(){
    if(!S.dirty[path]){flushing[path]=false;setSync();return;}
    var v=ver[path]||0,data=docData(path),ref=db.doc(path);
    (data===null?ref.delete():ref.set(data)).then(function(){
      if((ver[path]||0)===v){delete S.dirty[path];saveLocal();}
      loop();
    },function(err){
      flushing[path]=false;
      if(err&&err.code==='invalid_argument'){readOnly=true;}
      else if(!retryT){retryT=setTimeout(function(){retryT=null;flushAll();},3000+Math.random()*3000);}
      setSync();
    });
  })();
}
function flushAll(){Object.keys(S.dirty).forEach(flush);}
function onDias(snap){
  var before=JSON.stringify(S.days),remote={};
  snap.docs.forEach(function(d){var x=d.data();if(x)remote[d.id]=x;});
  Object.keys(remote).forEach(function(k){if(!S.dirty['dias/'+k])S.days[k]=clone(remote[k]);});
  if(!snap.metadata.fromCache){
    Object.keys(S.days).forEach(function(k){if(!(k in remote)&&!S.dirty['dias/'+k])delete S.days[k];});
  }
  if(JSON.stringify(S.days)!==before){saveLocal();D=derive(S.days);render();}
}
function onCfg(snap){
  if(S.dirty['config/app']||!snap.exists)return;
  var x=snap.data();if(!x)return;
  var before=JSON.stringify(S.cfg);
  S.cfg=Object.assign({meta:5,prio:['peito','costas','ombro'],custom:[]},clone(x));syncPlans();
  if(JSON.stringify(S.cfg)!==before){saveLocal();render();}
}
function initDb(tries){
  if(!window.claude||!window.claude.use){if(tries>0)setTimeout(function(){initDb(tries-1);},800);return;}
  window.claude.use('db').then(function(ns){
    if(!ns)return;
    db=ns;setSync();
    try{
      db.collection('dias').onSnapshot(onDias,function(){setSync();});
      db.doc('config/app').onSnapshot(onCfg,function(){});
    }catch(e){}
    flushAll();
  },function(){});
}

function chartWeeks(Dx,meta){

function niceTicks(min,max,n){
  if(min===max){min-=1;max+=1;}
  var raw=(max-min)/n,p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),f=raw/p,step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  var lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];
  for(var v=lo;v<=hi+step/2;v+=step)t.push(Math.round(v*1000)/1000);
  return t;
}
function chartLine(pts,unit){

  function X(p){return t1===t0?pl+pw/2:pl+pw*((+parse(p.date)-t0)/(t1-t0));}

  if(pts.length>1){
    s+='<path class="ar" d="'+d+'L'+X(pts[pts.length-1]).toFixed(1)+','+Y(lo)+'L'+X(pts[0]).toFixed(1)+','+Y(lo)+'Z"/><path class="ln" d="'+d+'"/>';
  }

  return s+'</svg>';
}
function demoDays(){
  var days={},seed=11,td=today(),cw=weekStart(td);
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var plan=[['peito','Supino inclinado halteres',30,2],['costas','Puxada alta aberta',62,2.5],['ombro','Elevação lateral halteres',10,1],['biceps','Rosca Scott',24,1],['triceps','Tríceps corda',28,2.5],['quadriceps','Leg press 45',180,10],['posterior','Mesa flexora',40,2.5]];
  var k=0;
  for(var w=9;w>=0;w--){
    var ws=addDays(cw,-7*w),n=3+Math.floor(rnd()*3),used=0;
    for(var i=0;i<7&&used<n;i++){
      var dt=addDays(ws,i);if(dt>td)break;
      if(rnd()<0.28&&7-i>n-used)continue;
      used++;var es=[];
      for(var j=0;j<2;j++){
        var p=plan[k%plan.length];k++;
        var kg=Math.round((p[2]*(1+(9-w)*0.017))/p[3])*p[3];
        es.push({id:'d'+k,g:p[0],ex:p[1],kg:kg,reps:8+Math.floor(rnd()*4),sets:3+Math.floor(rnd()*3),tec:'',feel:2,nota:'',t:k});
      }
      days[dt]={entries:es};
    }
  }
  return days;
}

function restCard(){
  var B=[[60,'até 60 s'],[90,'61 a 90 s'],[120,'91 a 120 s'],[180,'121 a 180 s'],[1e9,'mais de 180 s']].map(function(b){return {max:b[0],n:b[1],sum:0,c:0};});
  var up={s:0,c:0},same={s:0,c:0},dS=0,dC=0,rS=0,rC=0,ovS=0,ovC=0;
  D.list.forEach(function(e){
    if(!e.ss)return;
    var prev=null,P=e.pl?planGet(e.pl):null,ix=P&&e.px!=null?idxOf(e.pl,e.px):null,lim=ix!=null&&P.ex[ix].rest?P.ex[ix].rest:0;
    e.ss.forEach(function(s){
      if(s.d){dS+=s.d;dC++;}
      if(s.w)return;
      if(s.rs!=null&&!s.x&&prev){
        rS+=s.rs;rC++;
        if(lim){ovS+=s.rs/lim;ovC++;}
        if(s.k===prev.k&&prev.r>0){for(var i=0;i<B.length;i++)if(s.rs<=B[i].max){B[i].sum+=s.r/prev.r;B[i].c++;break;}}
        if(s.k>prev.k){up.s+=s.rs;up.c++;}else if(s.k===prev.k){same.s+=s.rs;same.c++;}
      }
      prev=s;
    });
  });
  var durS=0,durC=0;Object.keys(S.days).forEach(function(k){if(S.days[k].dur){durS+=S.days[k].dur;durC++;}});
  var h='<section class="card"><h2 class="h">Descanso e rendimento</h2><p class="sub">Só com séries cronometradas</p>';
  if(!dC&&!rC&&!durC)return h+'<p class="empty">Use o cronômetro ao registrar. Com ele o app mede o tempo de treino, de cada série e de cada descanso, e mostra aqui se descansar mais rende mais.</p></section>';
  h+='<div class="trio" style="margin-top:0"><div><span>Treino médio</span><b class="num">'+(durC?Math.round(durS/durC/60)+' min':'sem dado')+'</b></div><div><span>Série média</span><b class="num">'+(dC?Math.round(dS/dC)+' s':'sem dado')+'</b></div><div><span>Descanso médio</span><b class="num">'+(rC?mmss(rS/rC):'sem dado')+'</b></div></div>';
  var used=B.filter(function(b){return b.c>0;});
  if(used.length){
    h+='<p class="sub" style="margin:14px 0 4px">Repetições mantidas da série anterior, com a mesma carga</p>';
    B.forEach(function(b){
      if(!b.c)return;var pc=Math.round(b.sum/b.c*100);
      h+='<div class="gb" style="grid-template-columns:104px 1fr 44px" data-tip="'+b.n+': '+pc+'% das repetições, em '+b.c+(b.c===1?' série':' séries')+'"><span>'+b.n+'</span><div class="track"><div class="fill" style="width:'+Math.min(100,pc)+'%"></div></div><span class="v num">'+pc+'%</span></div>';
    });
    var good=used.filter(function(b){return b.c>=3;}).sort(function(a,b){return b.sum/b.c-a.sum/a.c;});
    h+='<p class="legend">'+(rC<20?'Leitura inicial, com '+rC+(rC===1?' descanso medido':' descansos medidos')+'. Fica confiável a partir de 20.':good.length>1?'Seu melhor rendimento vem com descanso de '+good[0].n+'.':'Ainda falta variar o descanso para comparar as faixas.')+'</p>';
  }
  if(up.c||same.c)h+='<p class="sub" style="margin:12px 0 0;font-size:14px;color:var(--ink)">'+(up.c?'Antes de subir a carga você descansa <b>'+mmss(up.s/up.c)+'</b>, em média. ':'')+(same.c?'Mantendo a carga, <b>'+mmss(same.s/same.c)+'</b>.':'')+'</p>';
  if(ovC){var ov=Math.round((ovS/ovC-1)*100);h+='<p class="sub" style="margin:6px 0 0;font-size:14px;color:var(--ink)">Seu descanso fica <b>'+Math.abs(ov)+'% '+(ov>=0?'acima':'abaixo')+'</b> do intervalo prescrito.</p>';}
  return h+'</section>';
}

  var day=S.days[UI.date]||(S.days[UI.date]={entries:[]}),e,isNew=!sh.id;

  else if(a==='pedelp'){
    if(!sh.cp){sh.cp=true;redrawLog();return;}
    var pid=sh.id;S.cfg.planos=editablePlans().filter(function(p){return p.id!==pid;});syncPlans();closeSheet();commit('config/app');toast('Treino excluído.');
  }
  else if(a==='xedit'){
    var Px=planGet(sh.id),xi=+b.dataset.i,xs=xi>=0?Px.ex[xi]:null;
    openSheet({type:'xedit',id:sh.id,i:xi,x:xs?{sid:xs.id,g:xs.g,ex:xs.ex,rows:parseP(xs),rest:xs.rest||0,tec:xs.tec||'',nota:xs.nota||'',a:(xs.a||[]).concat(['','','']).slice(0,3)}:{sid:null,g:'peito',ex:'',rows:[[0,10,12],[0,10,12],[0,10,12]],rest:90,tec:'',nota:'',a:['','','']}});
  }
  else if(a==='xback')openSheet({type:'pedit',id:sh.id});
  else if(a==='xg'){holdX();sh.x.g=v;redrawLog();}
  else if(a==='xw'){holdX();var xr=sh.x.rows[+b.dataset.i];xr[0]=xr[0]?0:1;redrawLog();}
  else if(a==='xdel'){holdX();if(sh.x.rows.length>1){sh.x.rows.splice(+b.dataset.i,1);redrawLog();}else toast('O exercício precisa de pelo menos 1 série.');}
  else if(a==='xadd'){holdX();var lx=sh.x.rows[sh.x.rows.length-1];sh.x.rows.push([0,lx[1],lx[2]]);redrawLog();}
  else if(a==='xrest'){holdX();sh.x.rest=Math.max(0,Math.min(600,sh.x.rest+(+v)));redrawLog();}
  else if(a==='xtec'){holdX();sh.x.tec=v;redrawLog();}
  else if(a==='xsave'){
    holdX();var xx=sh.x;
    if(!xx.ex){toast('Dê um nome ao exercício.');return;}
    var rws=xx.rows.filter(function(r){return r[1]>0;});
    if(!rws.length){toast('Inclua pelo menos 1 série com repetições.');return;}
    var Pl=planGet(sh.id);if(!Pl)return;
    var nsl={id:xx.sid!=null?xx.sid:uid(),g:xx.g,ex:xx.ex,p:genP(rws),rest:xx.rest,tec:xx.tec,nota:xx.nota,s:rws,a:xx.a.filter(function(n){return n&&n!==xx.ex;})};
    if(sh.i>=0)Pl.ex[sh.i]=nsl;else Pl.ex.push(nsl);
    commit('config/app');openSheet({type:'pedit',id:sh.id});toast('Exercício salvo.');
  }
  else if(a==='repeat'){
    var ls=lastSession(sh.g);if(!ls)return;
    var dn={};((S.days[UI.date]||{}).entries||[]).forEach(function(x){dn[x.ex]=1;});
    var li=ls.list.filter(function(x){return !dn[x.ex];});
    if(!li.length){toast('Tudo desse treino já foi registrado hoje.');return;}
    UI.queue={g:sh.g,list:li,i:0};openQueue();
  }
  else if(a==='del'){
    if(!sh.confirm){holdForm();sh.confirm=true;redrawLog();return;}
    var dd=S.days[UI.date];if(dd){dd.entries=dd.entries.filter(function(x){return x.id!==sh.id;});dd.u=Date.now();}
    closeSheet();commit('dias/'+UI.date);toast('Registro excluído.');
  }
  else if(a==='meta'){S.cfg.meta=Math.max(2,Math.min(7,S.cfg.meta+(+v)));commit('config/app');renderSheet();}
  else if(a==='prio'){var p=(S.cfg.prio||[]).slice(),i=p.indexOf(v);if(i>=0)p.splice(i,1);else p.push(v);S.cfg.prio=p;commit('config/app');renderSheet();}
  else if(a==='mode'){UI.mode=v;render();}
  else if(a==='csv'){
    var text=csv();
    try{navigator.clipboard.writeText(text).then(function(){toast('Histórico copiado. Cole em uma planilha.');},function(){toast('O aparelho bloqueou a cópia.');});}catch(e){toast('O aparelho bloqueou a cópia.');}
  }
});
document.addEventListener('input',function(ev){
  if((ev.target.id==='f-kg'||ev.target.id==='f-reps')&&UI.sheet&&UI.sheet.type==='log'){holdForm();refreshSets();}
  if(ev.target.id==='pick-q'&&UI.sheet&&UI.sheet.type==='pick'){UI.sheet.q=ev.target.value;$('#pick-list').innerHTML=pickRows();}
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='pe-n'&&UI.sheet&&UI.sheet.type==='pedit'){var Pn=planGet(UI.sheet.id),nv=ev.target.value.trim().slice(0,40);if(Pn&&nv){Pn.n=nv;commit('config/app');}}
  if(ev.target.id==='ex-sel'){UI.exSel=ev.target.value;var y=window.scrollY;render();window.scrollTo(0,y);}});
document.addEventListener('focusin',function(ev){var id=ev.target.id;if(id==='f-kg'||id==='f-reps'||id==='f-sets'){try{ev.target.select();}catch(e){}}});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&UI.sheet)closeSheet();
  if(ev.key==='Enter'&&ev.target.id==='new-ex'){ev.preventDefault();var b=document.querySelector('[data-a="addex"]');if(b)b.click();}
});
window.addEventListener('scroll',function(){$('#tip').hidden=true;},{passive:true});
window.addEventListener('hashchange',function(){var t=(location.hash||'').replace('#','')||'hoje';if(t!==UI.tab)setTab(t,false);});
window.addEventListener('online',flushAll);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  flushAll();
  if(!UI.sheet&&UI.tab==='hoje'){if(UI.date!==today()&&!S.days[UI.date])UI.date=today();render();}
});

/* ---------- Início ---------- */
loadLocal();
syncPlans();
tmLoad();
D=derive(S.days);
(function(){var all=[];Object.keys(EXS).forEach(function(g){EXS[g].forEach(function(n){all.push(n);});});document.getElementById('dl-ex').innerHTML=all.map(function(n){return '<option value="'+esc(n)+'">';}).join('');})();
setInterval(function(){
  var c=document.getElementById('tm-clock'),bx=document.getElementById('tm-box');
  if(c&&bx&&(bx.classList.contains('run')||bx.classList.contains('rest'))){c.textContent=mmss(tmNow());var lim=+bx.dataset.lim||0;if(bx.classList.contains('rest'))bx.classList.toggle('over',lim>0&&tmNow()>lim);}
  var se=document.getElementById('tm-sess');if(se&&TM.sess)se.textContent=mmss((Date.now()-TM.sess.t0)/1000);
},1000);
(function(){var t=(location.hash||'').replace('#','')||'hoje';if(t==='rapido'){t='tecnicas';UI.tsub='rapido';}UI.tab=TABS.indexOf(t)>=0?t:'hoje';})();
render();
if(TM.sess&&(TM.sess.date!==today()||Date.now()-(TM.sess.last||TM.sess.t0)>3*3600e3))tmFinish(TM.sess.last||TM.sess.t0);
initDb(4);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
